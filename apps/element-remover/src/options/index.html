<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规则管理 - Element Remover</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <header class="page-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div>
            <h1 class="page-title">Element Remover 规则管理</h1>
            <p class="page-desc">按网站和路径管理已保存的网页元素清理规则</p>
          </div>
        </div>

        <div class="stats-summary" id="stats-summary">
          <!-- Dynamically populated: X 个网站 · Y 条规则 -->
        </div>
      </div>
    </header>

    <!-- Toolbar: Search and Filter -->
    <section class="toolbar-section">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索网站域名、路径、规则名称..." aria-label="搜索规则">
      </div>

      <div class="filter-group" role="radiogroup" aria-label="状态筛选">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="review">需要复核</button>
        <button class="filter-btn" data-filter="disabled">已停用</button>
      </div>
    </section>

    <!-- Main Content: Hierarchy List -->
    <main class="main-content">
      <div id="rules-tree" class="rules-tree">
        <!-- Dynamically rendered host groups -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
          </svg>
        </div>
        <h2 class="empty-title">暂无已保存的清理规则</h2>
        <p class="empty-desc">
          在任意网页上打开 Element Remover 扩展图标，点击“选择页面元素”，选取并保存后，规则将在此处集中呈现。
        </p>
      </div>
    </main>

    <!-- Confirmation Modal Slot -->
    <div id="modal-container"></div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
