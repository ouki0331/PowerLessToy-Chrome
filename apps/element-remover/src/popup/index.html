<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Remover</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-main">
        <h1 class="header-title">Element Remover</h1>
        <button id="btn-open-options" class="icon-btn" title="打开规则管理设置" aria-label="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div id="scope-subtitle" class="scope-subtitle">正在获取页面信息...</div>
    </header>

    <!-- Unsupported Page Warning -->
    <div id="unsupported-banner" class="unsupported-banner" style="display: none;">
      <div class="unsupported-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="unsupported-text">
        <strong>此页面不支持元素清理</strong>
        <p id="unsupported-reason">浏览器内部页面或应用商店受到安全保护，禁止注入脚本。</p>
      </div>
    </div>

    <!-- Active Summary -->
    <section id="summary-section" class="summary-section">
      <div id="summary-headline" class="summary-headline">此页面还没有清理规则</div>
      <div id="summary-breakdown" class="summary-breakdown">使用下方按钮开始选取并清理页面元素</div>

      <div class="primary-action-wrapper">
        <button id="btn-start-pick" class="btn btn-primary btn-large">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          选择页面元素
        </button>
      </div>

      <div class="debug-toggle-row">
        <div class="debug-label-group">
          <span class="debug-title">Debug 标记</span>
          <span class="debug-hint">临时在被处理位置显示原位恢复点</span>
        </div>
        <button id="btn-toggle-debug" class="switch-btn" role="switch" aria-checked="false">
          <span id="debug-switch-text">关闭</span>
        </button>
      </div>
    </section>

    <!-- Current Page Rules Section -->
    <section class="rules-section">
      <h2 class="section-title">当前页面规则</h2>
      <div id="rules-list" class="rules-list">
        <!-- Dynamically populated -->
        <div class="rules-empty">当前没有正在生效的规则</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="btn-manage-all" class="footer-link-btn">
        管理全部规则
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
