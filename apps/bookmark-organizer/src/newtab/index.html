<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Organizer</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../../assets/icons/icon-48.png">
  <link rel="icon" type="image/png" sizes="128x128" href="../../assets/icons/icon-128.png">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <!-- Background Image & Overlay Layer -->
  <div id="bgLayer" class="bg-layer" aria-hidden="true" style="display: none;">
    <div id="bgImage" class="bg-image"></div>
    <div id="bgOverlay" class="bg-overlay"></div>
  </div>

  <!-- Top Header -->
  <header class="workbench-header" role="banner">
    <div class="header-container">
      <div class="brand-section">
        <span class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <h1 class="brand-title" id="appBrandTitle">Bookmark Organizer</h1>
        <span class="brand-badge" id="appTagline">Quiet Workbench</span>
      </div>

      <div class="header-actions">
        <!-- Theme Action -->
        <button id="themeToggleBtn" class="btn btn-ghost btn-sm" title="Theme (Light / Dark / System / Auto)" aria-haspopup="dialog" aria-expanded="false">
          <span id="themeBtnIcon" aria-hidden="true"></span>
          <span id="themeBtnText">Theme</span>
        </button>

        <!-- Background Header Action -->
        <button id="bgHeaderBtn" class="btn btn-ghost btn-sm" title="Background" aria-haspopup="dialog" aria-expanded="false">
          <span id="bgHeaderBtnIcon" aria-hidden="true"></span>
          <span id="bgHeaderBtnText">Background</span>
        </button>

        <!-- Backup & Import Actions -->
        <button id="importJsonBtn" class="btn btn-ghost btn-sm" title="Import bookmarks from JSON">
          <svg class="btn-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
            <polyline points="7 11 12 16 17 11"></polyline>
            <line x1="12" y1="4" x2="12" y2="16"></line>
          </svg>
          <span id="importBtnText">Import JSON</span>
        </button>
        <button id="exportBackupBtn" class="btn btn-ghost btn-sm" title="Export full JSON backup">
          <svg class="btn-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span id="exportBtnText">Export Backup</span>
        </button>
        <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">

        <button id="langToggleBtn" class="btn btn-ghost btn-sm" title="Toggle Language (EN / JA)">
          <svg class="btn-svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="currentLangLabel">EN</span>
        </button>
        <button id="toggleManageBtn" class="btn btn-secondary btn-sm" aria-pressed="false">
          <span class="manage-active-indicator" id="manageIndicator" style="display: none;"></span>
          <span id="manageBtnText">Manage Content</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Category Track -->
  <nav class="category-nav-wrapper" aria-label="Bookmark Categories">
    <div class="category-track">
      <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="Categories">
        <!-- Rendered dynamically -->
      </div>
      <button id="addCategoryBtn" class="category-action-btn" style="display: none;">
        + Add Category
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="workbench-main" id="mainContent" role="main">
    <!-- Non-destructive error state -->
    <div id="errorBanner" class="error-banner" style="display: none;" role="alert">
      <div class="error-content">
        <span class="error-title" id="errorTitle">Unable to load data</span>
        <span class="error-desc" id="errorDesc">Your stored links have not been modified. Click retry to reload.</span>
      </div>
      <button id="retryLoadBtn" class="btn btn-secondary btn-sm">Retry</button>
    </div>

    <!-- Undo Import Success Banner -->
    <div id="undoBanner" class="undo-banner" style="display: none;" role="status">
      <div class="undo-content">
        <span class="undo-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </span>
        <span id="undoBannerText" class="undo-text">Import completed.</span>
      </div>
      <div class="undo-actions">
        <button id="undoImportBtn" class="btn btn-primary btn-sm">Undo This Import</button>
        <button id="dismissUndoBtn" class="btn btn-ghost btn-sm btn-icon" aria-label="Dismiss banner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Category Header -->
    <div class="category-header" id="categoryHeader">
      <div class="cat-title-area">
        <h2 class="active-cat-name" id="activeCatTitle">Category</h2>
        <span class="cat-stats" id="catStatsLabel">0 groups</span>
      </div>

      <div class="cat-manage-controls">
        <div class="cat-sort-controls" id="catSortControls" role="group" aria-label="Sort groups">
          <button id="sortMostUsedBtn" class="btn btn-ghost btn-sm btn-icon cat-sort-btn" type="button" data-sort="most_used" title="Sort by Most Used" aria-label="Sort by Most Used" aria-pressed="false">
            <span class="icon-slot"></span>
          </button>
          <button id="sortRecentlyUsedBtn" class="btn btn-ghost btn-sm btn-icon cat-sort-btn" type="button" data-sort="recently_used" title="Sort by Recently Used" aria-label="Sort by Recently Used" aria-pressed="false">
            <span class="icon-slot"></span>
          </button>
          <button id="sortCreatedBtn" class="btn btn-ghost btn-sm btn-icon cat-sort-btn" type="button" data-sort="created_at" title="Sort by Created Date" aria-label="Sort by Created Date" aria-pressed="false">
            <span class="icon-slot"></span>
          </button>
        </div>
        <div id="catAdminButtons" style="display: none; gap: 6px;">
          <button id="renameCatBtn" class="btn btn-ghost btn-sm">Rename</button>
          <button id="deleteCatBtn" class="btn btn-ghost btn-sm danger">Delete</button>
        </div>
        <button id="addGroupBtn" class="btn btn-primary btn-sm">
          + Add Group
        </button>
      </div>
    </div>

    <!-- Group Grid Container -->
    <div class="group-grid" id="groupGrid">
      <!-- Rendered dynamically -->
    </div>

    <!-- Empty State for Category -->
    <div class="empty-state" id="categoryEmptyState" style="display: none;">
      <div class="empty-state-icon" aria-hidden="true">
        <svg class="empty-icon-svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <h3 class="empty-state-title" id="emptyCatTitle">No groups in this category yet.</h3>
      <p class="empty-state-lead" id="emptyCatLead">Create your first group to start organizing your project environments and links.</p>
      <button id="createFirstGroupBtn" class="btn btn-primary">
        Create First Group
      </button>
    </div>

    <div id="a11yAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>

  <!-- Modal Container for Dialogs -->
  <div id="modalContainer" style="display: none;"></div>

  <!-- Background Popover Menu Container -->
  <div id="bgPopoverContainer" class="bg-popover-container" style="display: none;"></div>

  <!-- Floating Action Dock (Bottom Right) -->
  <aside id="bgFab" class="bg-fab" aria-label="Background Controls">
    <div id="bgDock" class="bg-dock" role="toolbar" aria-label="Background Controls">
      <div id="bgDockActions" class="bg-dock-actions" aria-hidden="true">
        <button id="bgSourceBtn" class="bg-dock-btn" type="button" aria-label="Background Source" title="Background Source">
          <span class="icon-slot"></span>
        </button>
        <button id="bgFavBtn" class="bg-dock-btn" type="button" aria-label="Add to Favorites" title="Add to Favorites">
          <span class="icon-slot"></span>
        </button>
        <button id="bgNextBtn" class="bg-dock-btn" type="button" aria-label="Next Image" title="Next Image">
          <span class="icon-slot"></span>
        </button>
        <button id="bgLockBtn" class="bg-dock-btn" type="button" aria-label="Lock Current Image" title="Lock Current Image">
          <span class="icon-slot"></span>
        </button>
        <button id="bgInfoBtn" class="bg-dock-btn" type="button" aria-label="Image Information" title="Image Information" aria-haspopup="dialog" aria-expanded="false">
          <span class="icon-slot"></span>
        </button>
        <button id="bgSettingsBtn" class="bg-dock-btn" type="button" aria-label="Background Settings" title="Background Settings" aria-haspopup="dialog" aria-expanded="false">
          <span class="icon-slot"></span>
        </button>
      </div>
      <button id="bgDockTrigger" class="bg-dock-trigger" type="button" aria-label="Background Controls" title="Background Controls" aria-expanded="false">
        <span class="icon-slot"></span>
      </button>
    </div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
